[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "piano-waterfall"
version = "1.4.1"
description = "Turn MIDI files or piano recordings into a neon waterfall player."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dream-Alan", email = "805292940@qq.com" }]
keywords = ["midi", "piano", "visualizer", "synthesia", "pyside6", "music"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Topic :: Multimedia :: Video :: Display",
]
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.24",
    "soundfile>=0.12",
    "onnxruntime>=1.17",
    "mido>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pillow>=10",
    "pyinstaller>=6.0",
]

[project.gui-scripts]
piano-waterfall = "piano_waterfall.app:main"

[project.urls]
Homepage = "https://github.com/Dream-Alan/Piano_Waterfall_Layout"
Repository = "https://github.com/Dream-Alan/Piano_Waterfall_Layout"
Issues = "https://github.com/Dream-Alan/Piano_Waterfall_Layout/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
piano_waterfall = [
    "assets/*",
    "assets/models/*",
    "assets/samples/ATTRIBUTION.md",
    "assets/samples/piano/*.wav",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["piano_waterfall"]
