name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PIANO_WATERFALL_DATA_DIR: ${{ github.workspace }}/.devdata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean packaging/piano-waterfall.spec

      - name: Pack release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/PianoWaterfall/* -DestinationPath release/PianoWaterfall-windows-x64.zip

      - name: Smoke-test the frozen app
        shell: pwsh
        env:
          PIANO_WATERFALL_EXE: ${{ github.workspace }}\dist\PianoWaterfall\PianoWaterfall.exe
        run: |
          python -c "import os, subprocess, sys; sys.exit(subprocess.run([os.environ['PIANO_WATERFALL_EXE'], '--smoke-test'], timeout=90).returncode)"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/PianoWaterfall-windows-x64.zip
          generate_release_notes: true
